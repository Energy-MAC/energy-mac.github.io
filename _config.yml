# =============================================================
# Energy-MAC Lab Site
# Built with Minimal Mistakes Jekyll theme
# https://mmistakes.github.io/minimal-mistakes/
# =============================================================

remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"

# --- Site settings ---
title: "EMAC"
title: " "
title_separator: "-"
subtitle: "Energy Modeling, Analysis, and Control"
subtitle: " "
name: "Duncan Callaway"
description: "Energy Modeling, Analysis, and Control group at UC Berkeley"
url: "https://energy-mac.github.io"
baseurl: ""
repository: "Energy-MAC/energy-mac.github.io"
logo: "/assets/img/emaclab-scaled.png"

# --- Site author (shows in sidebar) ---
author:
  name: "Duncan Callaway"
  avatar: "/assets/img/headshot_small_23.png"
  bio: "Professor, Energy & Resources Group, UC Berkeley"
  location: "Berkeley, CA"
  email: "dcal@berkeley.edu"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:dcal@berkeley.edu"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=Ugijg1wAAAAJ&hl=en"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Energy-MAC"

