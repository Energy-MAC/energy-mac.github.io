# --- Reading files ---
include:
  - _pages
  - _pepole

# --- Collections ---
collections:
  people:
    output: true
    permalink: /people/:name/

# --- Defaults ---
defaults:
  # All pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
  # Posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      show_date: true
      read_time: false
      share: false
      related: false
  # Students collection
  - scope:
      path: ""
      type: students
    values:
      layout: single
      author_profile: false

# --- Plugins ---
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

# --- Pagination ---
paginate: 8
paginate_path: /news/page:num/

# --- Markdown ---
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true

# --- Other ---
timezone: "America/Los_Angeles"
permalink: /:year-:month-:day-:title/
date_format: "%B %-d, %Y"

# --- Exclude from build ---
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CHANGELOG.md
  - LICENSE
  - screenshot.png
  - Appraisals
  - staticman.yml
  - vendor
